<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メールアドレスの確認</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f3e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f3e8;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#ffffff;border:1px solid #d4cdb3;border-radius:8px;border-collapse:separate;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#2d3e1f;border-radius:8px 8px 0 0;padding:20px 32px;text-align:center;">
              <span style="font-family:'Hiragino Mincho ProN','Yu Mincho',YuMincho,serif;font-size:16px;font-weight:700;color:#ffffff;">将棋ブログ投稿サイト ～なりノート～</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 40px 40px;">
              <h1 style="margin:0 0 24px;font-family:'Hiragino Mincho ProN','Yu Mincho',YuMincho,serif;font-size:26px;font-weight:700;color:#2d3e1f;line-height:1.4;text-align:center;">
                メールアドレスの確認
              </h1>
              <p style="margin:0 0 8px;font-size:15px;color:#4b5563;line-height:1.8;">
                なりノートへご登録いただき、ありがとうございます。
              </p>
              <p style="margin:0 0 32px;font-size:15px;color:#4b5563;line-height:1.8;">
                以下のボタンをクリックして、メールアドレスを確認してください。
              </p>

              <!-- CTA Button -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:0 0 40px;">
                    <a href="{{verificationUrl}}"
                       style="display:inline-block;background-color:#88b04b;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 40px;border-radius:6px;">
                      メールアドレスを確認する
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <hr style="border:none;border-top:1px solid #e8e4d0;margin:0 0 24px;">

              <p style="margin:0 0 8px;font-size:13px;color:#6b7280;line-height:1.7;">
                ボタンが機能しない場合は、以下のURLをブラウザに貼り付けてください：
              </p>
              <p style="margin:0;font-size:12px;color:#88b04b;word-break:break-all;line-height:1.6;">
                {{verificationUrl}}
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#2d3e1f;border-radius:0 0 8px 8px;padding:24px 32px;text-align:center;">
              <p style="margin:0 0 8px;font-size:12px;color:#d1d5db;line-height:1.6;">
                このメールに心当たりがない場合は、無視していただいて構いません。
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;">
                © 2026 なりノート
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
