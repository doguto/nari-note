name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "nari-note-backend/**/*.cs"
      - "nari-note-frontend/src/**/*.ts"
      - "nari-note-frontend/src/**/*.tsx"
      - "infrastruture/**"
      - "**/*.md"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # 公式 code-review プラグインはレビュー処理を Task（サブエージェント起動）に依存しており、
          # allowed-tools に Task が無いためヘッドレスCIでは permission 拒否されコメントが付かない。
          # そのため自前の単一エージェント構成コマンド (.claude/commands/pr-review.md) を使う。
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
