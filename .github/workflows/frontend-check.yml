name: Frontend Check

on:
  pull_request:
    paths:
      - "nari-note-frontend/**"
      - ".github/actions/setup-frontend/**"
      - ".github/workflows/frontend-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nari-note-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nari-note-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Build
        run: npm run build
