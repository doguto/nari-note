name: Backend Test

on:
  pull_request:
    paths:
      - "nari-note-backend/**"
      - ".github/actions/setup-backend/**"
      - ".github/workflows/backend-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # dotnet test が Release ビルドを兼ねるため、ビルド専用のジョブは置かない
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nari-note-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      # 結合テストは Testcontainers で PostgreSQL を起動する（ubuntu-latest は Docker が利用可能）
      - name: Test
        run: dotnet test nari-note-backend.sln --configuration Release --no-restore
