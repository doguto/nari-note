# dnf-automatic の設定。userdata が /etc/dnf/automatic.conf に配置する
# OS のセキュリティ更新だけを自動適用し、PostgreSQL は自動更新の対象から外して手動で上げる

[commands]
upgrade_type = security
download_updates = yes
apply_updates = yes
# 実行時刻は timer 側で散らしているため、ここでの追加の待機は不要
random_sleep = 0
network_online_timeout = 60
# カーネル更新等の再起動は自動では行わず、PostgreSQL の更新作業に合わせて手動で行う
reboot = never

[emitters]
# 結果は journal (journalctl -u dnf-automatic) に出力する
emit_via = stdio

[base]
# パッケージ更新時の %postun で postgresql が再起動され DB が停止するのを避ける
exclude = postgresql17*
debuglevel = 1
