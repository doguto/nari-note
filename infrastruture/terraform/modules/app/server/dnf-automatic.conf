# dnf-automatic の設定。userdata が /etc/dnf/automatic.conf に配置する
# PostgreSQL を含む OS のセキュリティ更新を自動適用する

[commands]
upgrade_type = security
download_updates = yes
apply_updates = yes
# 実行時刻は timer 側で散らしているため、ここでの追加の待機は不要
random_sleep = 0
network_online_timeout = 60
# カーネル・glibc・systemd 等、プロセスの再起動では反映されない更新が入った時だけ OS を再起動する
# 既定の reboot_command は 5 分後の再起動で、全サービスは systemd により自動で起動する
reboot = when-needed

[emitters]
# 結果は journal (journalctl -u dnf-automatic) に出力する
emit_via = stdio

[base]
debuglevel = 1
