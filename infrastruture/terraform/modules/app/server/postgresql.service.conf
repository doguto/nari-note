# postgresql.service の上書き。userdata が /etc/systemd/system/postgresql.service.d/override.conf に配置する
[Unit]
# ディスク枯渇・設定ミス等で起動に失敗し続ける場合は再起動を諦め、DbUp のアラームで人が対応する
StartLimitIntervalSec=10min
StartLimitBurst=5

[Service]
Environment=PGDATA=/data/postgresql

# 1GiB のメモリをアプリと共有しており OOM Killer に postmaster が殺され得る。殺されたままだと RDS と違い誰も起動し直さない
Restart=on-failure
RestartSec=5s

# postmaster が殺されると全接続が切れるため OOM Killer の対象から外し、子プロセス (各接続) は通常の優先度に戻す
OOMScoreAdjust=-1000
Environment=PG_OOM_ADJUST_FILE=/proc/self/oom_score_adj
Environment=PG_OOM_ADJUST_VALUE=0
