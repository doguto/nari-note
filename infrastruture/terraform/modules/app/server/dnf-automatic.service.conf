# dnf-automatic.service の上書き。userdata が /etc/systemd/system/dnf-automatic.service.d/override.conf に配置する
# PostgreSQL の更新・OS の再起動の前に、直近 6 時間以内にベースバックアップが成功していることを確認する
# 成功していなければその日の更新は見送る (ExecCondition の失敗はユニットの失敗にならず、翌日に再度判定される)
#
# 更新後に nari-note-post-update で PostgreSQL のマイナー更新を適用し、更新が反映されていなければ PostgreSQL を再起動する
[Service]
ExecStartPost=/usr/local/sbin/nari-note-post-update
ExecCondition=/bin/sh -c 'test -n "$$(find /var/lib/nari-note-db-backup/last-base-success -mmin -360 2>/dev/null)" || { echo "直近 6 時間以内のベースバックアップ成功記録が無いため、更新を見送ります" >&2; exit 1; }'
