# キー名は alp json の既定値に合わせる。upstream_response_time は "-" やカンマ区切りになり得るため文字列で出す
log_format json escape=json '{"time":"$time_iso8601",'
                            '"host":"$remote_addr",'
                            '"forwardedfor":"$http_x_forwarded_for",'
                            '"req":"$request",'
                            '"method":"$request_method",'
                            '"uri":"$request_uri",'
                            '"status":$status,'
                            '"body_bytes":$body_bytes_sent,'
                            '"request_time":$request_time,'
                            '"response_time":"$upstream_response_time",'
                            '"ua":"$http_user_agent"}';

# Blue/Green デプロイの向き先。稼働系統の server 行は nari-note-deploy が書き換えて nginx を reload する
upstream nari_note_backend {
    include /etc/nginx/nari-note-backend/active-upstream.conf;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    access_log /var/log/nginx/access.log json;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    return 444;
}

server {
    listen 80;
    server_name api.nari-note.com;

    access_log /var/log/nginx/access.log json;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.nari-note.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log json;

    # .env が含まれるリクエストはアプリに負荷をかけずに拒否する
    location ~ /\.env {
        return 444;
    }

    location /api {
        # フロントエンドプロキシ経由でないリクエストを拒否する
        if ($http_x_narinote_kf != "__INTERNAL_API_KEY__") {
            return 444;
        }

        proxy_pass         http://nari_note_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
