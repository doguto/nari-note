# dnf-automatic.timer のスケジュール上書き。userdata が /etc/systemd/system/dnf-automatic.timer.d/override.conf に配置する
# 更新に伴うサービス・OS の再起動をアクセスの少ない時間帯 (04:30 JST 頃) に寄せる
# PostgreSQL の更新前に当日のバックアップが取れているよう、ベースバックアップ (18:15 UTC) の後に実行する
[Timer]
OnCalendar=
OnCalendar=*-*-* 19:30:00 UTC
RandomizedDelaySec=30m
Persistent=true
