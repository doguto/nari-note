# dnf-automatic.timer のスケジュール上書き。userdata が /etc/systemd/system/dnf-automatic.timer.d/override.conf に配置する
# 更新に伴うサービス・OS の再起動をアクセスの少ない時間帯 (05:00 JST 頃) に寄せる
# ベースバックアップ (18:15 UTC) が終わるまでの余裕を取って実行する。成功の確認は dnf-automatic.service.conf で行う
[Timer]
OnCalendar=
OnCalendar=*-*-* 20:00:00 UTC
RandomizedDelaySec=30m
Persistent=true
