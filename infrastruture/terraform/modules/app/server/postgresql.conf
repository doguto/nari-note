listen_addresses = 'localhost'

# アプリの接続プール上限 (InfrastructureServiceInstaller.DbMaxPoolSize = 20) + 管理者予約 3 + 手作業・バックアップ用 2
max_connections = 25

# t4g.micro (1GiB) で .NET アプリ・nginx・CloudWatch エージェントと同居している前提
# DB サイズ (2026-10 時点で約 9MB) に対して十分大きいため既定値を維持し、意図を明示する
shared_buffers = 128MB
# プランナー向けの見積もり値で、メモリは確保しない。既定の 4GB は物理メモリを超えるため実態に合わせる
effective_cache_size = 384MB

# Default の 4.0 は HDD 想定だが実際の環境は gp3 (SSD) であるため下げる
random_page_cost = 1.1

# クエリ統計の集計 (postgresql17-contrib)
shared_preload_libraries = 'pg_stat_statements'

# 500ms 以上かかる遅延クエリを記録
log_min_duration_statement = 500ms

# 遅延クエリログにトークン・メールアドレス等のバインド値を残さない
log_parameter_max_length = 0

# ロック待ちを記録
log_lock_waits = on

# ロック保持・VACUUM 阻害・接続プール占有を防ぐ
idle_in_transaction_session_timeout = 30s

# WAL を WAL-G で S3 へアーカイブし、任意の時点へ戻せるようにする (infrastruture/docs/db-backup-recovery.md)
archive_mode = on
archive_command = '/usr/local/bin/wal-g --config /etc/wal-g/config.json wal-push %p'
# アクセスが少ないと 16MB の WAL セグメントがなかなか埋まらず S3 へ送られないため、最長 60 秒で切り替えて失うデータを抑える
archive_timeout = 60s
