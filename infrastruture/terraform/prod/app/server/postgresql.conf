listen_addresses = 'localhost'

# アプリの接続プール上限 (InfrastructureServiceInstaller.DbMaxPoolSize = 20) + 管理者予約 3 + 手作業・バックアップ用 2
max_connections = 25

# t3.micro (911MB) で .NET アプリ・nginx・CloudWatch エージェントと同居している前提
# DB サイズ (2026-10 時点で約 9MB) に対して十分大きいため既定値を維持し、意図を明示する
shared_buffers = 128MB
# プランナー向けの見積もり値で、メモリは確保しない。既定の 4GB は物理メモリを超えるため実態に合わせる
effective_cache_size = 384MB

# 既定の 4.0 は「HDD でランダム読み込みがシーケンシャルの 40 倍遅く、その 9 割がキャッシュに当たる」という想定の値
# gp3 (SSD) ではランダム読み込みのコストがシーケンシャルとほぼ変わらないため下げる
random_page_cost = 1.1

# 実行回数・合計時間の大きいクエリを特定するため、正規化したクエリ単位で統計を収集する (postgresql17-contrib に含まれる)
# 起動時に共有メモリ (既定の pg_stat_statements.max = 5000 で約 2MB) を確保するため、変更には再起動が必要
shared_preload_libraries = 'pg_stat_statements'
